# Hugo configuration file
baseURL: "https://www.wilbertvandolleweerd.com/"
title: "Wilbert van Dolleweerd"

enableEmoji: true

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Blog
      pageRef: /blog
      weight: 2      
    - name: About me
      pageRef: /about
      weight: 3
    - name: Contact ↗
      url: "mailto:wilbert@arentheym.com"
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: "https://github.com/WilbertOnGithub/"
      params:
        icon: github
    - name: LinkedIn
      weight: 6
      url: "https://www.linkedin.com/in/wilbertvandolleweerd"
      params:
        icon: linkedin        
    - name: Bluesky
      weight: 7
      url: "https://bsky.app/profile/weeveedee.bsky.social"
      params:
        icon: bluesky
    - name: Theme Toggle
      params:
        type: theme-toggle
        label: true

params:
  blog:
    list:
      displayTags: true
  toc:
    displayTags: true

  # Display the last modification date
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"  

  page:
  # full (100%), wide (90rem), normal (1280px)
    width: full
    
  # Search
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content    

  navbar:
    displayTitle: true
    displayLogo: false
    
  externalLinkDecoration: true    

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
    
enableGitInfo: true